<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" fill="none">
  <!--
    Default illustration for the Login / Register pages (right-hand panel).
    To use your own image, drop it in this folder and change the import in
    src/config/authConfig.js — no component changes needed.
  -->
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A949B" stop-opacity="0.35" />
      <stop offset="1" stop-color="#8A949B" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Analytics card -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="390" height="220" rx="12" fill="#FFFFFF" />
  </g>
  <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="14" fill="#1F3A3D">Analytics</text>

  <!-- Period tabs -->
  <rect x="268" y="26" width="112" height="20" rx="4" fill="#FFFFFF" stroke="#D5DCE0" />
  <text x="278" y="39.5" font-family="Inter, Arial, sans-serif" font-size="8.5" fill="#6E7C84">Weekly</text>
  <line x1="311" y1="26" x2="311" y2="46" stroke="#D5DCE0" />
  <text x="318" y="39.5" font-family="Inter, Arial, sans-serif" font-size="8.5" fill="#6E7C84">Monthly</text>
  <line x1="349" y1="26" x2="349" y2="46" stroke="#D5DCE0" />
  <text x="355" y="39.5" font-family="Inter, Arial, sans-serif" font-size="8.5" fill="#6E7C84">Yearly</text>

  <!-- Grid -->
  <g stroke="#E8ECEF" stroke-width="1">
    <line x1="28" y1="72" x2="382" y2="72" />
    <line x1="28" y1="102" x2="382" y2="102" />
    <line x1="28" y1="132" x2="382" y2="132" />
    <line x1="28" y1="162" x2="382" y2="162" />
    <line x1="28" y1="192" x2="382" y2="192" />
  </g>

  <!-- Area + lines -->
  <path d="M28 186 L92 132 L152 92 L212 134 L272 112 L332 124 L382 100 L382 192 L28 192 Z" fill="url(#area)" />
  <path d="M28 186 L92 132 L152 92 L212 134 L272 112 L332 124 L382 100" stroke="#55626B" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M28 172 L92 152 L152 168 L212 122 L272 142 L332 106 L382 96" stroke="#8A949B" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Day labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="9" fill="#6E7C84">
    <text x="28" y="214">MON</text>
    <text x="80" y="214">TUE</text>
    <text x="132" y="214">WED</text>
    <text x="186" y="214">THU</text>
    <text x="240" y="214">FRI</text>
  </g>

  <!-- Donut card -->
  <g filter="url(#shadow)">
    <rect x="318" y="112" width="192" height="208" rx="12" fill="#FFFFFF" />
  </g>
  <circle cx="414" cy="216" r="54" stroke="#E9EDF0" stroke-width="18" />
  <circle
    cx="414"
    cy="216"
    r="54"
    stroke="#043E50"
    stroke-width="18"
    stroke-dasharray="142.5 339.3"
    transform="rotate(-90 414 216)"
  />
  <text x="414" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#6E7C84">Total</text>
  <text x="414" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1F3A3D">42%</text>
</svg>
